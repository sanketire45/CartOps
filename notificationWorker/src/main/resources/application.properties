spring.application.name=notification-worker
server.port=${PORT:9090}

# ── MySQL ────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://mysql:3306/ecommercespring
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

# ── SQS (Spring Cloud AWS v3) ─────────────────────────────────────────────────
# IRSA injects AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE env vars automatically.
# Spring Cloud AWS SDK v2 picks these up — no explicit credentials needed.
spring.cloud.aws.region.static=${AWS_REGION:us-east-2}
spring.cloud.aws.sqs.listener.acknowledgement-mode=MANUAL

# ── Eureka ────────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# ── Actuator health probes (K8s liveness + readiness) ────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
