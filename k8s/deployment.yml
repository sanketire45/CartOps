apiVersion: apps/v1
kind: Deployment
metadata: 
 name: product-category
spec: 
 replicas: 2
 strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
 selector: 
  matchLabels: 
   app: product-category 
 template:
  metadata: 
   labels:
    app: product-category
  spec:                                  # this is template.spec (the POD spec)
   terminationGracePeriodSeconds: 30     # ← pod-level: sibling of `containers:` / `initContainers:`
   initContainers:                     # ← runs BEFORE the app container
   - name: wait-for-mysql
     image: busybox:1.36
     command: ['sh','-c','until nc -z mysql 3306; do echo "waiting for mysql..."; sleep 2; done; echo "mysql is up!"']
   containers:
   - name: product-category
     image: product-category:v2
     imagePullPolicy: IfNotPresent
     ports: 
      - containerPort: 8080
     envFrom: 
      - configMapRef: 
         name: ecom-config
     env: 
      - name: SPRING_DATASOURCE_PASSWORD
        valueFrom: 
         secretKeyRef:  
          name: mysql-secret
          key: password 

     startupProbe:                          # "done booting yet?" — protects the slow Spring boot
       httpGet:
        path: /actuator/health/readiness
        port: 8080
       failureThreshold: 30
       periodSeconds: 5                     # 30×5 = 150s to boot
     livenessProbe:                         # "alive?" — restart if frozen (NO db check → actuator liveness group)
       httpGet:
        path: /actuator/health/liveness
        port: 8080
       periodSeconds: 10
       failureThreshold: 3
     readinessProbe:                        # "ready?" — pull from traffic if DB down (actuator readiness group)
       httpGet:
        path: /actuator/health/readiness
        port: 8080
       periodSeconds: 10
       failureThreshold: 3

     resources:
       requests:
         cpu: "250m"
         memory: "300Mi"
       limits:
         cpu: "500m"       # > request  → Burstable (baseline + room to burst)
         memory: "512Mi"

