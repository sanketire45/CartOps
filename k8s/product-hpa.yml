apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-category-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-category
  minReplicas: 2
  maxReplicas: 4                 # ← was 10 — now fits the node's real capacity
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
