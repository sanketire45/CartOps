# =============================================================================
#  ecom-dev.yaml — ArgoCD Application for the ecom Helm chart (dev env)
# =============================================================================
#  This file lives in GitOps/apps/ — root-app.yaml watches this directory.
#  When you push this file, ArgoCD automatically creates the ecom-dev Application.
#  No manual kubectl apply needed.
#
#  DEPLOY FLOW:
#    Jenkins CI builds image → pushes to ECR with :abc1234
#    Jenkins updates values-dev.yaml image tag → commits to Git
#    ArgoCD detects commit → selfHeal=true → auto-syncs → helm upgrade runs
#    New pods roll out, old pods terminate → zero-downtime deploy
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after operators/CRDs (wave 0-1), Phase 3
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/sanketire45/CartOps.git
    targetRevision: main
    path: helm/ecom
    helm:
      valueFiles:
        - values.yaml     # base config (ports, mysql, eureka defaults)
        - values-dev.yaml # ECR images + replicas + IRSA ARNs — Jenkins writes here

  destination:
    server: https://kubernetes.default.svc
    namespace: ecom   # ArgoCD creates this namespace automatically

  # HPA writes the live replica count on the Deployment's spec.replicas field.
  # Without this, ArgoCD sees "live=3, git=2" → marks OutOfSync → selfHeal reverts
  # the HPA's scale back to 2 every sync cycle. ignoreDifferences tells ArgoCD
  # "I know this field will differ — that's intentional, don't touch it."
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: product-category
      namespace: ecom
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: order-service
      namespace: ecom
      jsonPointers:
        - /spec/replicas
    # KEDA sets notification-worker replicas to 0 when queue is empty.
    # Without this, ArgoCD sees "live=0, git=1" and reverts it every sync cycle.
    - group: apps
      kind: Deployment
      name: notification-worker
      namespace: ecom
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true       # remove K8s resources deleted from Helm chart
      selfHeal: true    # re-sync if cluster state drifts from Git
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # handles large CRDkubectl get hpa -n ecom -ws without annotation size limit
