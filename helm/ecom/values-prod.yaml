# prod: ECR images + higher replica counts
# IMAGE_TAG is substituted by Jenkins CI with the git commit SHA (e.g. abc1234)
# before running: helm upgrade --install ecom ./helm/ecom -f values-prod.yaml

product:
  image: 656022989575.dkr.ecr.us-east-2.amazonaws.com/ecom-product-category:v0.0.1
  replicaCount: 4

order:
  image: 656022989575.dkr.ecr.us-east-2.amazonaws.com/ecom-order-service:v0.0.1
  replicaCount: 2

eureka:
  image: 656022989575.dkr.ecr.us-east-2.amazonaws.com/ecom-eureka-server:v0.0.1
  replicaCount: 1

frontend:
  image: 656022989575.dkr.ecr.us-east-2.amazonaws.com/ecom-frontend:v0.0.1
  replicaCount: 2

ingress:
  enabled: true
  host: ""   # empty = match all Host headers (NLB DNS access works without a domain)
