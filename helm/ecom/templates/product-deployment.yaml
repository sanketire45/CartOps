apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-category
  labels:
    app: product-category
spec:
  replicas: {{ .Values.product.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never kill old pod until new one is Ready
      maxSurge: 1         # at most 1 extra pod during rollout
  selector:
    matchLabels:
      app: product-category
  template:
    metadata:
      labels:
        app: product-category
    spec:
      serviceAccountName: product-category-sa   # Phase 3 #9: IRSA — gives this pod AWS identity
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh','-c','until nc -z mysql 3306; do echo "waiting for mysql..."; sleep 2; done; echo "mysql is up!"']
      containers:
        - name: product-category
          image: {{ .Values.product.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.product.port }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          envFrom:                            # pull ALL keys from the ConfigMap
            - configMapRef:
                name: ecom-config
          env:
            - name: PORT
              value: "{{ .Values.product.port }}"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.product.port }}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.product.port }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.product.port }}
            periodSeconds: 10
            failureThreshold: 3
