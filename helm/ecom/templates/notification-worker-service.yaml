apiVersion: v1
kind: Service
metadata:
  name: notification-worker
  namespace: ecom
  labels:
    app: notification-worker
spec:
  type: ClusterIP       # internal only — no ingress path, not called by other services via HTTP
  selector:
    app: notification-worker
  ports:
    - port: {{ .Values.notificationWorker.port }}
      targetPort: {{ .Values.notificationWorker.port }}
      protocol: TCP
