apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server           # fixed name — apps connect to "eureka-server"
  labels:
    app: eureka-server
spec:
  replicas: {{ .Values.eureka.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: eureka-server
          image: {{ .Values.eureka.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.eureka.port }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.eureka.port }}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.eureka.port }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.eureka.port }}
            periodSeconds: 10
            failureThreshold: 3
