apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: {{ .Values.order.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-service-sa   # Phase 3 #9: IRSA — gives this pod AWS identity
      terminationGracePeriodSeconds: 30
      initContainers:                        # wait for the DB first (same as your raw manifest)
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh','-c','until nc -z mysql 3306; do echo "waiting for mysql..."; sleep 2; done; echo "mysql is up!"']
      containers:
        - name: order-service
          image: {{ .Values.order.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.order.port }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          env:
            - name: PORT
              value: "{{ .Values.order.port }}"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.order.port }}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.order.port }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.order.port }}
            periodSeconds: 10
            failureThreshold: 3
