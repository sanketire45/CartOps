# =============================================================================
#  external-secret.yaml  —  Phase 3 #8: ESO wiring
# =============================================================================
#  Two objects:
#    1. SecretStore  → tells ESO "authenticate to AWS using this IAM role"
#    2. ExternalSecret → tells ESO "fetch THIS secret and create THAT K8s Secret"
#
#  After these are applied, ESO creates the K8s Secret automatically.
#  secret.yaml is commented out — ESO owns the Secret now.
# =============================================================================

---
# ── 1. SecretStore — the auth configuration ───────────────────────────────────
# Think of this as ESO's AWS credentials config.
# jwt auth = IRSA: ESO uses the ServiceAccount token to assume the IAM role.
# The ServiceAccount must be annotated with the IAM role ARN (done in argocd.tf
# via the ESO Helm install, or manually after deploy — see outputs.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore          # cluster-scoped: can reference ServiceAccounts across namespaces
metadata:
  name: aws-secrets-store         # no namespace field — ClusterSecretStore is cluster-wide
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets          # ESO's own ServiceAccount (annotated with IRSA role)
            namespace: external-secrets     # allowed here because ClusterSecretStore is cluster-scoped

---
# ── 2. ExternalSecret — the fetch + create instruction ────────────────────────
# refreshInterval: how often ESO polls Secrets Manager for changes.
# target.name: the K8s Secret that ESO will create (same name as before — pods unchanged).
# data[].secretKey: the key inside the K8s Secret.
# data[].remoteRef.key: the path in Secrets Manager.
# data[].remoteRef.property: the JSON field inside the secret value.
#
# Result: kubectl get secret mysql-secret -n ecom → exists, created by ESO
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-external-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-store
    kind: ClusterSecretStore

  target:
    name: mysql-secret                      # ← K8s Secret name (unchanged from before)
    creationPolicy: Owner                   # ESO owns it — deletes it if ExternalSecret is deleted

  data:
    - secretKey: password                   # ← key in the K8s Secret (pods read this)
      remoteRef:
        key: ecom/mysql-password            # ← path in Secrets Manager
        property: password                  # ← JSON field: {"password": "Sanket@123"}
