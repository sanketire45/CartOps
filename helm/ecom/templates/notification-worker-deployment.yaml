apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  labels:
    app: notification-worker
spec:
  replicas: {{ .Values.notificationWorker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      serviceAccountName: notification-worker-sa   # IRSA — SQS ReceiveMessage + DeleteMessage only
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: notification-worker
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-worker
          image: {{ .Values.notificationWorker.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.notificationWorker.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          env:
            - name: PORT
              value: "{{ .Values.notificationWorker.port }}"
            - name: SQS_QUEUE_URL
              value: {{ .Values.notificationWorker.sqsQueueUrl | quote }}
            - name: AWS_REGION
              value: {{ .Values.notificationWorker.awsRegion | quote }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/notification_db"
            - name: SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED
              value: "false"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
          envFrom:
            - configMapRef:
                name: ecom-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.notificationWorker.port }}
            failureThreshold: 60   # Spring Boot + SQS client init can be slow on cold start
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.notificationWorker.port }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.notificationWorker.port }}
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
