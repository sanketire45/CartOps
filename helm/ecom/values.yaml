# ===== the whole ecommerce stack, one knob-panel =====

# mysqlPassword: "Sanket@123"   # Phase 3 #8: removed — secret lives in AWS Secrets Manager now
mysql:
  image: mysql:8.0
  port: 3306
  storage: 1Gi

eureka:
  image: eureka:latest
  replicaCount: 1
  port: 8761

product:
  image: product-category:v99-nope
  replicaCount: 2
  port: 8080
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    cpuTargetPercent: 60    # scale out when average pod CPU crosses 60% of requests.cpu

order:
  image: order-service:v2
  replicaCount: 2
  port: 7878
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    cpuTargetPercent: 60

frontend:
  image: ecom-frontend:latest
  replicaCount: 2

notificationWorker:
  image: ecom-notification-worker:latest
  replicaCount: 1            # KEDA (#25) will override this — starts at 0 when queue empty
  port: 9090
  sqsQueueUrl: ""            # set in values-dev.yaml after terraform apply outputs the URL
  awsRegion: "us-east-2"

# shared non-secret config (becomes the ConfigMap that product + order read)
config:
  FAKESTORE_BASE_URL: "https://fakestoreapi.in/api/"
  EUREKA_INSTANCE_PREFERIPADDRESS: "true"

ingress:
  enabled: false
  className: nginx
  host: ecom.local
  annotations: {}
