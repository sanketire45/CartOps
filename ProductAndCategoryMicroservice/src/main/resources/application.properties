spring.application.name=EcommerceSpring
spring.datasource.url=jdbc:mysql://mysql:3306/ecommerce_db
spring.datasource.username=root
spring.datasource.password=Sanket@123
#this tells springboot which jdbc driver class to use.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#Tells hibernate to print all the generated sql queires to the console. Useful for debugging or learning
spring.jpa.show-sql=true
#Specifies the SQL dialect hibernate should use.
#Ensure hibernates generates sql-optimised sql syntax. Without this, springboot might guess based on jdbc url.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#Controls how hibernate handles schema generation:
#none > no changes to db schema
#create > Drones and recreates schema in every run
#create-drop > Drop schema at app stops
#update > updates DB schema (add new cols/tables, won't delete anything)
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
