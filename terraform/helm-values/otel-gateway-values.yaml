# =============================================================================
#  otel-gateway-values.yaml — OTel Collector in Deployment (gateway) mode
# =============================================================================
#  Role: receive OTLP from every agent, enrich with K8s metadata, tail-sample
#        traces, fan out to the pillar-specific backends.
#
#  M1 state: debug exporter only (backends don't exist yet). As M3/M10/M14
#  land, ADD real exporters here and swap the pipeline target. No app change.
# =============================================================================

# ── Resources: heavier than agents — this is where processing happens ───────
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi   # memory_limiter set to 768Mi — stays under this

# ── Presets: enrichment belongs on the gateway ───────────────────────────────
presets:
  # ENABLE k8sattributes here (NOT on the agent). The preset also grants the
  # chart's ServiceAccount the required RBAC — get/list/watch on pods and
  # namespaces across the cluster. Without this preset you'd write the
  # ClusterRole + Binding by hand.
  kubernetesAttributes:
    enabled: true
    # Extract pod UID from the connection source IP — lets the processor
    # match incoming OTLP to its originating pod.
    extractAllPodLabels: false
    extractAllPodAnnotations: false

  # No log file reading on the gateway (it's not on every node).
  logsCollection:
    enabled: false

  # Platform metrics come via native Prometheus scrape — not this gateway.
  hostMetrics:
    enabled: false
  kubeletMetrics:
    enabled: false

# ── Collector config ──────────────────────────────────────────────────────────
config:

  # ── RECEIVERS: same OTLP endpoints agents send to ──────────────────────────
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
          # Allow bigger inbound payloads from agent batches.
          max_recv_msg_size_mib: 16
        http:
          endpoint: 0.0.0.0:4318

  # ── PROCESSORS: the heavy lifting ──────────────────────────────────────────
  # Order (critical):
  #   1. memory_limiter — ALWAYS first; back-pressure before any work is done.
  #   2. k8sattributes  — enrich with pod/ns/node/deployment labels.
  #                       Must run before sampling so dropped traces are
  #                       at least labeled correctly in debug output.
  #   3. tail_sampling  — (traces only) decide which traces to keep.
  #                       Runs AFTER enrichment so sampling policies can
  #                       match on enriched labels if needed.
  #   4. batch          — ALWAYS last; bundle for export.
  processors:

    memory_limiter:
      check_interval: 1s
      limit_mib: 768
      spike_limit_mib: 128

    # k8sattributes injected by the preset above; defaults add:
    #   k8s.pod.name, k8s.namespace.name, k8s.node.name,
    #   k8s.deployment.name, k8s.container.name, k8s.pod.uid, k8s.pod.start_time
    # Override here only if we need extra fields later.

    # tail_sampling — the "how do you trace at 50+ services" answer.
    # Policies are OR semantics: if ANY policy says "keep", the trace is kept.
    tail_sampling:
      # Wait up to 10s after a trace starts before deciding. Trades a bit of
      # delay for a complete-trace view. If decision_wait < real trace span,
      # we decide on a partial trace (can miss an error that happened late).
      decision_wait: 10s
      # Number of in-flight traces the processor can hold before evicting.
      num_traces: 50000
      # How often to clean up expired traces.
      expected_new_traces_per_sec: 100
      policies:
        # 1) KEEP every trace with any ERROR span. Non-negotiable for debug.
        - name: errors-policy
          type: status_code
          status_code:
            status_codes: [ERROR]
        # 2) KEEP every trace slower than 500ms. SLO-targeted retention.
        - name: slow-policy
          type: latency
          latency:
            threshold_ms: 500
        # 3) Probabilistically keep 10% of everything else.
        #    At 1000 RPS, this cuts stored traces 10× without losing error coverage.
        - name: probabilistic-policy
          type: probabilistic
          probabilistic:
            sampling_percentage: 10

    batch:
      timeout: 5s
      send_batch_size: 2048
      send_batch_max_size: 4096

  # ── EXPORTERS: fan-out destinations ────────────────────────────────────────
  #
  # ⚠️ M1 STATE: debug only — backends land in M3 (Prometheus), M10 (ES),
  # M14 (Tempo). As each arrives, UNCOMMENT and add to the matching
  # service.pipelines[*].exporters list below.
  exporters:
    # debug exporter — prints OTLP to stdout. `kubectl logs` the gateway to
    # see spans/metrics/logs flowing. Verbosity: detailed = full payload.
    debug:
      verbosity: detailed
      # Limit log lines per sample so a burst doesn't flood stdout.
      sampling_initial: 2
      sampling_thereafter: 100

    # ── Future exporters — kept commented until the backends exist. ──────────
    #
    # prometheusremotewrite:                                   # M3
    #   endpoint: http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write
    #   tls:
    #     insecure: true
    #   resource_to_telemetry_conversion:
    #     enabled: true   # k8sattributes labels become Prometheus labels
    #
    # elasticsearch:                                           # M10
    #   endpoints: [https://elasticsearch-es-http.observability.svc.cluster.local:9200]
    #   logs_index: ecom-logs
    #   user: elastic
    #   password: ${ES_PASSWORD}
    #   tls:
    #     insecure_skip_verify: true   # ECK self-signed cert in dev
    #
    # otlp/tempo:                                              # M14
    #   endpoint: tempo.observability.svc.cluster.local:4317
    #   tls:
    #     insecure: true
    #
    # otlp/jaeger:                                             # M18 (optional)
    #   endpoint: jaeger-collector.observability.svc.cluster.local:4317
    #   tls:
    #     insecure: true

  # ── SERVICE: wire the pipelines ────────────────────────────────────────────
  service:
    telemetry:
      metrics:
        address: 0.0.0.0:8888
      logs:
        level: info     # bump to debug temporarily if troubleshooting

    pipelines:
      # Traces: receive → limit → enrich → sample → batch → export
      traces:
        receivers:  [otlp]
        processors: [memory_limiter, k8sattributes, tail_sampling, batch]
        exporters:  [debug]
        # When M14 lands → swap `debug` for `[otlp/tempo]`.
        # When M18 lands → `[otlp/tempo, otlp/jaeger]` (fan-out to BOTH).

      # Metrics: receive → limit → enrich → batch → export
      # NO tail_sampling — not a trace concept.
      metrics:
        receivers:  [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters:  [debug]
        # When M3 lands → swap `debug` for `[prometheusremotewrite]`.

      # Logs: receive → limit → enrich → batch → export
      logs:
        receivers:  [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters:  [debug]
        # When M10 lands → swap `debug` for `[elasticsearch]`.
