# =============================================================================
#  otel-gateway-values.yaml — OTel Collector in Deployment (gateway) mode
# =============================================================================
#  Role: receive OTLP from every agent, enrich with K8s metadata, tail-sample
#        traces, fan out to the pillar-specific backends.
#
#  M1 state: debug exporter only (backends don't exist yet). As M3/M10/M14
#  land, ADD real exporters here and swap the pipeline target. No app change.
# =============================================================================

# ── Extra env vars — sourced from Kubernetes Secrets ─────────────────────────
# ES_PASSWORD: ECK creates ecom-logs-es-elastic-user automatically when the
# Elasticsearch CR is reconciled. Key "elastic" = the superuser password.
# The gateway's elasticsearch exporter reads it as ${env:ES_PASSWORD}.
extraEnvs:
  - name: ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: ecom-logs-es-elastic-user
        key: elastic
        # optional=true: ECK only creates this secret after Elasticsearch boots
        # (via ArgoCD, after Terraform Phase 3). Without optional=true the pod
        # gets CreateContainerConfigError and loops forever until ES is ready.
        # boot.sh waits for the secret and then restarts the deployment so the
        # real password is loaded.
        optional: true

# ── Resources: heavier than agents — this is where processing happens ───────
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 800Mi   # memory_limiter set to 600Mi — stays under this

# ── Presets: enrichment belongs on the gateway ───────────────────────────────
presets:
  # ENABLE k8sattributes here (NOT on the agent). The preset also grants the
  # chart's ServiceAccount the required RBAC — get/list/watch on pods and
  # namespaces across the cluster. Without this preset you'd write the
  # ClusterRole + Binding by hand.
  kubernetesAttributes:
    enabled: true
    # Extract pod UID from the connection source IP — lets the processor
    # match incoming OTLP to its originating pod.
    extractAllPodLabels: false
    extractAllPodAnnotations: false

  # No log file reading on the gateway (it's not on every node).
  logsCollection:
    enabled: false

  # Platform metrics come via native Prometheus scrape — not this gateway.
  hostMetrics:
    enabled: false
  kubeletMetrics:
    enabled: false

# ── Collector config ──────────────────────────────────────────────────────────
config:

  # ── RECEIVERS: same OTLP endpoints agents send to ──────────────────────────
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
          # Allow bigger inbound payloads from agent batches.
          max_recv_msg_size_mib: 16
        http:
          endpoint: 0.0.0.0:4318

  # ── PROCESSORS: the heavy lifting ──────────────────────────────────────────
  # Order (critical):
  #   1. memory_limiter — ALWAYS first; back-pressure before any work is done.
  #   2. k8sattributes  — enrich with pod/ns/node/deployment labels.
  #                       Must run before sampling so dropped traces are
  #                       at least labeled correctly in debug output.
  #   3. tail_sampling  — (traces only) decide which traces to keep.
  #                       Runs AFTER enrichment so sampling policies can
  #                       match on enriched labels if needed.
  #   4. batch          — ALWAYS last; bundle for export.
  processors:

    memory_limiter:
      check_interval: 1s
      limit_mib: 600       # 75% of 800Mi container limit — fires before OOMKill
      spike_limit_mib: 100

    # k8sattributes injected by the preset above; defaults add:
    #   k8s.pod.name, k8s.namespace.name, k8s.node.name,
    #   k8s.deployment.name, k8s.container.name, k8s.pod.uid, k8s.pod.start_time
    # Override here only if we need extra fields later.

    # tail_sampling — M15: 4-tier sampling strategy for 50+ services.
    #
    # WHY tail sampling (not head sampling):
    #   Head sampling decides at the first span — before you know if the trace
    #   has an error or is slow. Tail sampling waits for the complete trace, so
    #   you never accidentally drop the one trace that shows the bug.
    #
    # WHY NOT 100% sampling:
    #   At 1000 RPS, 100% = 1000 traces/s to store forever. At 5% probabilistic
    #   for background traffic, you store ~50 traces/s while keeping 100% of
    #   the data that matters (errors, slow, business-critical paths).
    #
    # Tier structure (OR semantics — ANY match keeps the trace):
    #   Tier 1 — Errors:          ALL traces with an ERROR span        (100%)
    #   Tier 2 — Slow:            ALL traces > 500ms                   (100%)
    #   Tier 3 — Critical paths:  order-service + notification-worker  (100%)
    #   Tier 4 — Background:      everything else (browsing, Eureka)   (5%)
    tail_sampling:
      # Wait 10s before deciding. A trace that takes 8s end-to-end must
      # complete before we can see whether it had an error in the last span.
      # Setting this lower than the real trace duration = deciding on partial data.
      decision_wait: 10s
      # In-flight trace buffer. At 100 expected traces/s × 10s decision_wait,
      # 1000 traces are in flight at steady state. 50 000 is a 50× headroom.
      num_traces: 50000
      expected_new_traces_per_sec: 100
      policies:

        # ── Tier 1: ALWAYS KEEP — error traces ────────────────────────────────
        # Any span in ERROR status keeps the entire trace. This is the incident
        # root-cause data: without it you can see THAT something failed (metrics)
        # but not WHERE in the call graph (traces).
        - name: keep-errors
          type: status_code
          status_code:
            status_codes: [ERROR]

        # ── Tier 2: ALWAYS KEEP — SLO-breach traces ───────────────────────────
        # 500ms is the p99 SLO target for this app. Every trace that breaches it
        # is a data point for the latency budget investigation.
        # Interview: "how do you distinguish p99 from median?" — you query
        # histogram_quantile(0.99, ...) in Prometheus; traces then explain WHY
        # specific requests hit that tail.
        - name: keep-slow
          type: latency
          latency:
            threshold_ms: 500

        # ── Tier 3: ALWAYS KEEP — critical business path ──────────────────────
        # order-service is the revenue path: an order that fails and isn't traced
        # means you can't answer "what happened to order #12345?".
        # 100% retention here regardless of whether the trace is fast or clean.
        #
        # service.name is a *resource* attribute (set by spring.application.name /
        # OTEL_SERVICE_NAME). string_attribute only checks span attributes, so we
        # use ottl_condition which can access resource.attributes directly.
        # Eureka registers this as "orderservice" (no hyphen); match both forms.
        - name: keep-order-service
          type: ottl_condition
          ottl_condition:
            error_mode: ignore
            span:
              - 'resource.attributes["service.name"] == "order-service" or resource.attributes["service.name"] == "orderservice"'

        # notification-worker is the async leg of the order flow (order → SQS →
        # worker). Keep its traces so M16 (trace across SQS hop) works end-to-end:
        # if the worker's span is sampled away, the distributed trace is broken.
        - name: keep-notification-worker
          type: ottl_condition
          ottl_condition:
            error_mode: ignore
            span:
              - 'resource.attributes["service.name"] == "notification-worker"'

        # ── Tier 4: PROBABILISTIC — background traffic ────────────────────────
        # Product browsing, Eureka heartbeats, health checks: useful for trend
        # analysis but not every request matters. 5% keeps ~50 traces/s at
        # 1000 RPS — enough for RED dashboards while cutting Tempo storage 20×.
        # Tune knob: 20% during load tests, 1% if Tempo storage grows.
        - name: probabilistic-background
          type: probabilistic
          probabilistic:
            sampling_percentage: 5

    batch:
      timeout: 5s
      send_batch_size: 2048
      send_batch_max_size: 4096

  # ── EXPORTERS: fan-out destinations ────────────────────────────────────────
  #
  # ⚠️ M1 STATE: debug only — backends land in M3 (Prometheus), M10 (ES),
  # M14 (Tempo). As each arrives, UNCOMMENT and add to the matching
  # service.pipelines[*].exporters list below.
  exporters:
    # debug exporter — prints OTLP to stdout. `kubectl logs` the gateway to
    # see spans/metrics/logs flowing. Verbosity: detailed = full payload.
    debug:
      verbosity: detailed
      # Limit log lines per sample so a burst doesn't flood stdout.
      sampling_initial: 2
      sampling_thereafter: 100

    # ── M3 LIVE: push app metrics into kube-prometheus-stack via remote_write.
    # The chart's Prometheus service DNS name differs from the Operator's bare
    # "prometheus-operated" — the kube-prometheus-stack chart exposes it as
    # `kube-prom-stack-kube-prome-prometheus`. Port 9090 /api/v1/write is the
    # Prometheus remote-write receiver endpoint (enabled by the chart's
    # `enableRemoteWriteReceiver: true` knob).
    prometheusremotewrite:
      endpoint: http://kube-prom-stack-kube-prome-prometheus.observability.svc.cluster.local:9090/api/v1/write
      tls:
        insecure: true
      # Convert OTel resource attributes (k8s.namespace.name, deployment.environment,
      # service.name, host.name) into Prometheus LABELS on every sample.
      # Without this, metrics would arrive without k8s context — unusable in dashboards.
      resource_to_telemetry_conversion:
        enabled: true

    # ── M10 LIVE: ship logs to Elasticsearch ─────────────────────────────────
    # ECK names the HTTP Service <CR-name>-es-http in the same namespace.
    # TLS: ECK self-signed CA — insecure_skip_verify for dev. Production path:
    #   mount ecom-logs-es-http-certs-public Secret and use tls.ca_file.
    # Auth: elastic superuser password injected as ES_PASSWORD via extraEnvs.
    # OTel env expansion syntax: ${env:VAR} (not bare ${VAR}).
    elasticsearch:
      endpoints: ["https://ecom-logs-es-http.observability.svc.cluster.local:9200"]
      logs_index: logs-ecom
      user: elastic
      password: ${env:ES_PASSWORD}
      tls:
        insecure_skip_verify: true

    # ── M14 LIVE: ship traces to Grafana Tempo ───────────────────────────────
    # Tempo exposes OTLP gRPC on port 4317 (same protocol agents use).
    # insecure=true: cluster-internal traffic, no TLS needed.
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true

    # ── Future exporters ─────────────────────────────────────────────────────
    #
    # otlp/jaeger:                                             # M18 (optional)
    #   endpoint: jaeger-collector.observability.svc.cluster.local:4317
    #   tls:
    #     insecure: true

  # ── SERVICE: wire the pipelines ────────────────────────────────────────────
  service:
    telemetry:
      metrics:
        address: 0.0.0.0:8888
      logs:
        level: info     # bump to debug temporarily if troubleshooting

    pipelines:
      # Traces: receive → limit → enrich → sample → batch → Tempo
      # M14 live: otlp/tempo. M15 live: 4-tier tail_sampling strategy.
      # When M18 lands → [otlp/tempo, otlp/jaeger] (fan-out to BOTH).
      traces:
        receivers:  [otlp]
        processors: [memory_limiter, k8sattributes, tail_sampling, batch]
        exporters:  [otlp/tempo]

      # Metrics: receive → limit → enrich → batch → export
      # NO tail_sampling — not a trace concept.
      # M3 live: exporter swapped from debug to prometheusremotewrite.
      # App metrics (http.server.request.duration, jvm.memory.used, Hikari pool,
      # Spring MVC counters) now land in Prometheus and become queryable in Grafana.
      metrics:
        receivers:  [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters:  [prometheusremotewrite]

      # Logs: receive → limit → enrich → batch → Elasticsearch
      # M10 live: exporter swapped from debug to elasticsearch.
      logs:
        receivers:  [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters:  [elasticsearch]
