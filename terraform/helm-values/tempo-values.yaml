# =============================================================================
#  tempo-values.yaml — Grafana Tempo (monolithic mode) dev-tier config
#  Chart: grafana/tempo 1.24.4 (Tempo 2.9.0)
# =============================================================================
#  Monolithic = all Tempo components run in a SINGLE binary/pod.
#  Prod path: grafana/tempo-distributed (ingestor/querier/compactor split).
#
#  Dynamic values injected via `set` blocks in tempo.tf:
#    tempo.storage.trace.s3.bucket  → ecom-tempo-traces-<account-id>
#    tempo.storage.trace.s3.region  → us-east-2
#    serviceAccount.annotations     → IRSA role ARN
# =============================================================================

# ── SERVICE ACCOUNT ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: tempo
  annotations: {}   # IRSA annotation injected via `set` in tempo.tf

# ── RESOURCES (under tempo: in v1.24.4+) ──────────────────────────────────────
tempo:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Accept OTLP over gRPC (from OTel gateway) on port 4317.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  # Tempo HTTP API listen port (Grafana datasource queries here).
  # v1.24.4+ default is 3200; set explicitly to match the datasource URL.
  server:
    http_listen_port: 3200

  storage:
    trace:
      # S3 backend — bulk trace data lives here, NOT on the PVC.
      # Bucket name and region injected via `set` blocks in tempo.tf.
      backend: s3
      s3:
        # bucket and region come from set {} in tempo.tf
        # IRSA handles auth — no access_key/secret_key here.
        insecure: false   # use HTTPS for S3 API calls

      # WAL path on the PVC — in-flight spans before flush to S3.
      wal:
        path: /var/tempo/wal

      # Local cache for recently-uploaded blocks (speeds up queries on fresh data).
      local:
        path: /var/tempo/blocks

  # Keep traces for 30 days — matches the S3 lifecycle rule.
  retention: 720h

  compactor:
    compaction:
      block_retention: 720h

# ── PERSISTENCE ───────────────────────────────────────────────────────────────
# The WAL (write-ahead log) and active block index live on a PVC.
# Completed blocks are flushed to S3 and removed from local disk.
persistence:
  enabled: true
  storageClassName: gp3
  size: 2Gi
  accessModes:
    - ReadWriteOnce

# ── SERVICE ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
